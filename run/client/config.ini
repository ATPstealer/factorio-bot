[path]
read-data=/mnt/games/steam/steamapps/common/Factorio/data
write-data=/home/mav/GolandProjects/Factorio/run/client

[interface]
; фиксированный масштаб UI — бот опирается на координаты GUI
ui-scale-mode=manual
custom-ui-scale=1
show-tips-and-tricks-notifications=false

[graphics]
full-screen=false
; минимальная графика: рендер в Xephyr программный (llvmpipe) — экономим CPU
graphics-quality=medium
show-smoke=false
show-clouds=false
show-fog=false
show-space-dust=false
show-decoratives=false
show-particles=false
show-item-shadows=false
show-inserter-shadows=false
show-animated-water=false
show-animated-ghosts=false
show-tree-distortion=false
additional-terrain-effects=false
high-quality-animations=false
high-quality-shadows=false
high-quality-terrain=false
elevated-rail-shadows=false

[sound]
; клиент бота играет без звука
master-muted=true
master-volume=0
